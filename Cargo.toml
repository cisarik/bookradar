[package]
name = "bookradar-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Deterministic domain rules for BookRadar book-offer observations."
repository = "https://github.com/cisarik/bookradar"
publish = false

[workspace]
members = [".", "crates/bookradar-store", "crates/bookradar-ui"]
default-members = [".", "crates/bookradar-store", "crates/bookradar-ui"]
resolver = "3"
